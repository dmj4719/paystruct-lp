<head>

  <title>無料資料ダウンロード｜PayStruct</title>
  <meta name="description" content="PayStructの無料資料をダウンロード。建設業特化のオールインワンクラウド。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+JP:wght@400;500&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PM6HT9J4"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <section class="final-cta section--dark section--clipped bg-blueprint" id="cta" style="min-height:100vh; display:flex; flex-direction:column; justify-content:center;">
    <span class="en-aside">FREE DOCUMENT</span>
    <div class="final-cta__header">
      <p class="final-cta__lead">＼ たったの10秒 ／</p>
      <h2 class="final-cta__title">無料で資料を見てみる</h2>
    </div>

    <form class="form" id="contact-form">
      <div class="form__group"><label class="form__label">受注形態<span class="form__required">必須</span></label><div class="form__options"><label class="form__option"><input type="radio" name="order_type" value="元請けになることが多い" required><span>元請けになることが多い</span></label><label class="form__option"><input type="radio" name="order_type" value="下請けになることが多い"><span>下請けになることが多い</span></label></div></div>
      <div class="form__group"><label class="form__label">現在の課題<span class="form__required">必須</span></label><select class="form__select" name="challenge" required><option value="" disabled selected>選択してください</option><option value="下請けへの支払いが遅れがち">下請けへの支払いが遅れがち</option><option value="見積〜請求のやり取りに時間がかかる">見積〜請求のやり取りに時間がかかる</option><option value="電帳法／インボイス対応ができていない">電帳法／インボイス対応ができていない</option><option value="下請けが他社に流れるのが不安">下請けが他社に流れるのが不安</option><option value="その他">その他</option></select></div>
      <div class="form__group"><label class="form__label">会社名<span class="form__required">必須</span></label><input type="text" class="form__input" name="company" placeholder="株式会社〇〇建設" required></div>
      <div class="form__group"><label class="form__label">お名前<span class="form__required">必須</span></label><input type="text" class="form__input" name="name" placeholder="山田 太郎" required></div>
      <div class="form__group"><label class="form__label">メールアドレス<span class="form__required">必須</span></label><input type="email" class="form__input" name="email" placeholder="example@company.co.jp" required></div>
      <div class="form__group"><label class="form__label">電話番号<span class="form__required">必須</span></label><input type="tel" class="form__input" name="tel" placeholder="090-1234-5678" required></div>
      <button type="submit" class="btn btn--primary btn--full btn--arrow"><span class="btn__label">無料で資料をダウンロード <span class="btn__arrow">→</span></span></button>
    </form>

    <p style="margin-top:24px;"><a href="index.html" style="color:rgba(255,255,255,0.6); font-size:14px; text-decoration:underline;">← LPに戻る</a></p>
  </section>

  <footer class="footer"><p class="footer__company">株式会社PayStruct</p><p class="footer__copy">&copy; 2026 株式会社PayStruct</p></footer>

</body>
</html>
